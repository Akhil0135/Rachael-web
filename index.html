<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moving Train Animation</title>

<style>
  body {
    margin: 0;
    background: #050505;
    overflow: hidden;
  }

  /* Background: Parallax layers */
  .sky {
    position: absolute;
    width: 200%;
    height: 100%;
    background: linear-gradient(#0a0a18, #000000);
    animation: skyMove 30s linear infinite;
  }

  @keyframes skyMove {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .stars {
    position: absolute;
    width: 200%;
    height: 100%;
    background: radial-gradient(white 1px, transparent 1px) 0 0 / 3px 3px repeat;
    opacity: 0.6;
    animation: starMove 60s linear infinite;
  }

  @keyframes starMove {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* Track */
  .track {
    position: absolute;
    bottom: 40px;
    width: 200%;
    height: 20px;
    background: repeating-linear-gradient(
      90deg,
      #3a3a3a 0px,
      #3a3a3a 40px,
      #1a1a1a 40px,
      #1a1a1a 60px
    );
    animation: trackMove 2s linear infinite;
  }

  @keyframes trackMove {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* Train */
  .train {
    position: absolute;
    bottom: 60px;
    left: 10%;
    width: 400px;
    height: 120px;
    background: #d32f2f;
    border-radius: 10px;
    box-shadow: 0 0 20px #ff0000aa;
    display: flex;
    justify-content: space-between;
    padding: 10px;
  }

  .window {
    width: 60px;
    height: 50px;
    background: #87cefa;
    border-radius: 5px;
    box-shadow: inset 0 0 10px #ffffff55;
  }

  .wheels {
    position: absolute;
    bottom: -25px;
    left: 20px;
    width: 360px;
    height: 40px;
    display: flex;
    justify-content: space-between;
  }

  .wheel {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #111;
    border: 4px solid #444;
    animation: wheelSpin 0.5s linear infinite;
  }

  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</head>

<body>
  <div class="sky"></div>
  <div class="stars"></div>
  <div class="track"></div>

  <div class="train">
    <div class="window"></div>
    <div class="window"></div>
    <div class="window"></div>
  </div>

  <div class="wheels">
    <div class="wheel"></div>
    <div class="wheel"></div>
    <div class="wheel"></div>
  </div>

</body>
</html>
